<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate Pro Calculator</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

              body {
            background-color: #000000; color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            /* 100vdh পাল্টে 100dvh করা হলো */
            height: 100dvh; 
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            /* পেজ বাউন্স বা নিচে টানা বন্ধ করার জন্য */
            overscroll-behavior: none; 
            /* স্ক্রিনকে একদম লক করে রাখার জন্য */
            position: fixed; 
            inset: 0;
              }

        /* --- Liquid Glass ambient background --- */
        .liquid-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .liquid-blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; animation: liquidFloat 20s ease-in-out infinite; }
        .blob-1 { width: 280px; height: 280px; background: radial-gradient(circle, #00e5ff, transparent 70%); top: -70px; left: -70px; animation-duration: 19s; }
        .blob-2 { width: 320px; height: 320px; background: radial-gradient(circle, #ff5722, transparent 70%); bottom: -90px; right: -70px; animation-duration: 23s; animation-delay: -4s; }
        .blob-3 { width: 240px; height: 240px; background: radial-gradient(circle, #4caf50, transparent 70%); top: 38%; left: 55%; animation-duration: 21s; animation-delay: -8s; }
        .blob-4 { width: 220px; height: 220px; background: radial-gradient(circle, #ff9800, transparent 70%); bottom: 15%; left: -50px; animation-duration: 25s; animation-delay: -12s; }
        @keyframes liquidFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            25% { transform: translate(30px, -25px) scale(1.1); }
            50% { transform: translate(-25px, 25px) scale(0.92); }
            75% { transform: translate(18px, 15px) scale(1.05); }
        }

        .calculator {
            width: 100%; max-width: 400px; height: 100vh;
            display: flex; flex-direction: column;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            position: relative; z-index: 1;
        }

        /* --- Display Area --- */
        .display-container {
            flex: 1; display: flex; flex-direction: column;
            justify-content: flex-end; align-items: flex-end;
            padding: 30px 20px; position: relative; gap: 5px;
        }

        /* Top Action Buttons (Sci & History) */
        .top-actions {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px;
            z-index: 50;
        }

        .dot-menu-wrap { position: relative; }
        .dot-btn { font-size: 1.3rem; padding: 8px 14px; line-height: 1; }

        .dot-menu {
            position: absolute; top: 48px; right: 0; min-width: 190px;
            background: linear-gradient(160deg, rgba(40,40,48,0.55), rgba(15,15,20,0.55));
            backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px; padding: 10px; z-index: 300;
            opacity: 0; transform: translateY(-8px) scale(0.96); pointer-events: none;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.15);
            overflow: hidden;
        }
        .dot-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

        .dot-menu-label {
            color: #666; font-size: 0.7rem; font-weight: bold; letter-spacing: 1px;
            text-transform: uppercase; padding: 6px 10px 2px;
        }
        .dot-menu-item {
            display: block; width: 100%; text-align: left; background: none; border: none;
            color: #fff; font-size: 0.95rem; padding: 10px; border-radius: 10px; cursor: pointer;
            opacity: 0; transform: translateY(8px); transition: background 0.15s;
        }
        .dot-menu.open .dot-menu-item { animation: dotItemIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .dot-menu.open .dot-menu-item:nth-of-type(1) { animation-delay: 0.02s; }
        .dot-menu.open .dot-menu-item:nth-of-type(2) { animation-delay: 0.06s; }
        .dot-menu.open .dot-menu-item:nth-of-type(3) { animation-delay: 0.10s; }
        @keyframes dotItemIn { to { opacity: 1; transform: translateY(0); } }
        .dot-menu-item:active { background: rgba(255,255,255,0.1); transform: scale(0.98) !important; }
        .dot-menu-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 6px 4px; }

        .action-btn {
            background: linear-gradient(160deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
            color: #00e5ff;
            border: 1px solid rgba(255,255,255,0.18); padding: 8px 16px;
            border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9rem;
            backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.2);
            position: relative; overflow: hidden;
        }
        .action-btn::before {
            content: ''; position: absolute; top: -50%; left: -60%; width: 40%; height: 200%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
            animation: glassSheen 5s ease-in-out infinite; pointer-events: none;
        }
        @keyframes glassSheen {
            0% { transform: translateX(-40%) rotate(20deg); }
            50%, 100% { transform: translateX(320%) rotate(20deg); }
        }
        .action-btn:active { 
            transform: scale(0.92); 
            background: rgba(0, 229, 255, 0.2); 
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .current { 
            font-size: 3.8rem; font-weight: 300; color: #ffffff; 
            line-height: 1.2; transition: font-size 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            max-width: 100%; overflow-x: auto; white-space: nowrap;
            text-align: right; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .current::-webkit-scrollbar { display: none; }
        
        .live-result {
            font-size: 2rem; color: #00e5ff;
            min-height: 40px; font-weight: 500; 
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: right; opacity: 0.8;
            text-shadow: 0 2px 8px rgba(0, 229, 255, 0.3);
        }
        /* Smooth pop animation for live result */
        .live-result.updating { transform: scale(1.05); opacity: 1; color: #ffffff; }

        .slide-up { animation: slideUpAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slideUpAnim {
            0% { transform: translateY(15px); opacity: 0; filter: blur(4px); }
            100% { transform: translateY(0); opacity: 1; filter: blur(0); }
        }

        .never-settle {
            font-size: 2.8rem !important; font-weight: bold;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- Keypad Area --- */
        .keypad {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
            padding: 15px 20px 25px 20px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
            border-top: 1px solid rgba(255,255,255,0.08);
            border-top-left-radius: 35px; border-top-right-radius: 35px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn {
            position: relative; z-index: 1; overflow: hidden;
            background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
            font-size: 1.8rem; display: flex; justify-content: center; align-items: center;
            cursor: pointer; aspect-ratio: 1 / 1; 
            max-width: 75px; max-height: 75px; margin: auto; width: 100%;
            backdrop-filter: blur(10px) saturate(160%); -webkit-backdrop-filter: blur(10px) saturate(160%);
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.08);
            transition: box-shadow 0.4s ease-in, transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
        }

        .btn:active, .btn.keyboard-active {
            z-index: 10; background: rgba(255,255,255,0.14); transform: scale(0.88);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.15);
        }

        .btn-top, .btn-op { color: #01c1d5; font-weight: 500; }
        .btn-top:active, .btn-op:active {
            background: rgba(5, 170, 190, 0.2); z-index: 100;
            box-shadow: inset 0 0 1px rgba(0,0,0,0.8), 0 0 40px 15px rgba(12, 187, 217, 0.4);
        }

        .btn-equals {
            background: linear-gradient(135deg, #ff9800, #ff5722); color: #ffffff; border: none;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.4), 0 4px 15px rgba(255,87,34,0.3);
            animation: equalsPulse 3s ease-in-out infinite;
        }
        @keyframes equalsPulse {
            0%, 100% { box-shadow: inset 0 -2px 5px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.4), 0 4px 15px rgba(255,87,34,0.3); }
            50% { box-shadow: inset 0 -2px 5px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.4), 0 4px 26px rgba(255,87,34,0.6); }
        }
        .btn-equals:active {
            background: linear-gradient(135deg, #e68a00, #e64a19); transform: scale(0.85); z-index: 100;
            box-shadow: inset 0 0 1px rgba(0,0,0,0.8), 0 0 50px 20px rgba(245, 110, 44, 0.6);
            animation: none;
        }

        /* Polished Ripple */
        .ripple {
            position: absolute; border-radius: 50%; transform: scale(0);
            animation: rippleAnim 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            background: rgba(255, 255, 255, 0.25); pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

        /* --- Scientific Buttons --- */
        .btn-sci { 
            color: #ffcc00; font-size: 1.1rem; font-weight: bold; 
            display: none; opacity: 0; transform: translateY(15px); 
        }
        .show-sci { gap: 8px; padding: 15px; }
        .show-sci .btn { font-size: 1.3rem; max-width: 60px; max-height: 60px; }
        .show-sci .btn-sci { display: flex; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .show-sci .btn-sci:nth-child(1) { animation-delay: 0.00s; }
        .show-sci .btn-sci:nth-child(2) { animation-delay: 0.02s; }
        .show-sci .btn-sci:nth-child(3) { animation-delay: 0.04s; }
        .show-sci .btn-sci:nth-child(4) { animation-delay: 0.06s; }
        .show-sci .btn-sci:nth-child(5) { animation-delay: 0.08s; }
        .show-sci .btn-sci:nth-child(6) { animation-delay: 0.10s; }
        .show-sci .btn-sci:nth-child(7) { animation-delay: 0.12s; }
        .show-sci .btn-sci:nth-child(8) { animation-delay: 0.14s; }
        .show-sci .btn-sci:nth-child(9) { animation-delay: 0.16s; }
        .show-sci .btn-sci:nth-child(10) { animation-delay: 0.18s; }
        .show-sci .btn-sci:nth-child(11) { animation-delay: 0.20s; }
        .show-sci .btn-sci:nth-child(12) { animation-delay: 0.22s; }

        .show-sci .btn-equals { font-size: 1.8rem; }
        .show-sci .btn-sci span { font-size: 0.8rem; vertical-align: super; }

        @keyframes popIn { to { opacity: 1; transform: translateY(0); } }

        /* --- Polished History Panel (Liquid Glass Modal) --- */
        .history-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
            z-index: 150; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .history-overlay.open { opacity: 1; pointer-events: auto; }

        .history-panel {
            position: absolute; top: 0; right: -100%; width: 85%; height: 100%;
            background: linear-gradient(160deg, rgba(45,45,55,0.55), rgba(15,15,20,0.6));
            backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-left: 1px solid rgba(255,255,255,0.18);
            z-index: 200; display: flex; flex-direction: column; padding: 25px 20px;
            transition: right 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.7), inset 1px 0 1px rgba(255,255,255,0.15);
        }
        .history-panel.open { right: 0; }
        
        .history-header { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 15px; 
        }
        .history-header h3 { color: #00e5ff; font-weight: 500; font-size: 1.2rem; letter-spacing: 1px; }
        .close-btn { 
            background: rgba(255,255,255,0.12); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; width: 35px; height: 35px; 
            border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: 0.2s; 
            display: flex; justify-content: center; align-items: center;
        }
        .close-btn:active { transform: scale(0.9) rotate(90deg); background: rgba(255,87,34,0.8); }
        
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-right: 5px; }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .history-item { 
            background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015));
            backdrop-filter: blur(10px);
            padding: 15px; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.08); cursor: pointer; 
            transition: all 0.2s; animation: fadeSlideIn 0.4s ease forwards; opacity: 0; transform: translateY(10px);
        }
        .history-item:active { transform: scale(0.96); background: rgba(255,255,255,0.1); border-color: rgba(0,229,255,0.3); }
        
        .hist-expr { color: #aaa; font-size: 0.95rem; margin-bottom: 5px; word-wrap: break-word; }
        .hist-res { color: #fff; font-size: 1.4rem; font-weight: 400; color: #00e5ff; }
        
        .clear-hist-btn { 
            margin-top: 15px; padding: 14px; background: rgba(255,87,34,0.12); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,87,34,0.5); color: #ff5722; border-radius: 12px; 
            cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s;
        }
        .clear-hist-btn:active { background: rgba(255,87,34,0.3); transform: scale(0.95); }

        @keyframes fadeSlideIn { to { opacity: 1; transform: translateY(0); } }

        /* ========================================================= */
        /* --- EXTRA TOOLS PANEL (added on top; calculator untouched) --- */
        /* ========================================================= */
        .tools-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
            z-index: 150; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .tools-overlay.open { opacity: 1; pointer-events: auto; }

        .tools-panel {
            position: absolute; top: 0; left: -100%; width: 92%; height: 100%;
            background: linear-gradient(160deg, rgba(40,45,42,0.55), rgba(15,20,17,0.6));
            backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-right: 1px solid rgba(255,255,255,0.18);
            z-index: 200; display: flex; flex-direction: column; padding: 25px 20px;
            transition: left 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.7), inset -1px 0 1px rgba(255,255,255,0.15); overflow-y: auto;
        }
        .tools-panel.open { left: 0; }

        .tools-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 18px;
        }
        .tools-header h3 { color: #4caf50; font-weight: 500; font-size: 1.2rem; letter-spacing: 1px; }

        .tool-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .tool-card {
            background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px; padding: 16px 8px; text-align: center; cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); color: #fff;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.12);
            opacity: 0; transform: translateY(10px) scale(0.95);
        }
        .tools-panel.open .tool-card {
            animation: cardPopIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .tools-panel.open .tool-card:nth-child(1) { animation-delay: 0.03s; }
        .tools-panel.open .tool-card:nth-child(2) { animation-delay: 0.07s; }
        .tools-panel.open .tool-card:nth-child(3) { animation-delay: 0.11s; }
        .tools-panel.open .tool-card:nth-child(4) { animation-delay: 0.15s; }
        .tools-panel.open .tool-card:nth-child(5) { animation-delay: 0.19s; }
        .tools-panel.open .tool-card:nth-child(6) { animation-delay: 0.23s; }
        @keyframes cardPopIn { to { opacity: 1; transform: translateY(0) scale(1); } }
        .tool-card:active { transform: scale(0.93) !important; background: rgba(76,175,80,0.2); border-color: rgba(76,175,80,0.5); box-shadow: 0 0 20px rgba(76,175,80,0.25); }
        .tool-card .tc-icon { font-size: 1.7rem; display: block; margin-bottom: 6px; }
        .tool-card .tc-label { font-size: 0.8rem; color: #ccc; }

        .tool-view { display: none; flex-direction: column; gap: 14px; }
        .tool-view.active { display: flex; animation: fadeSlideIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        .tool-back-btn {
            align-self: flex-start;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); color: #4caf50;
            padding: 8px 14px; border-radius: 14px; font-size: 0.85rem; font-weight: bold; cursor: pointer;
            transition: transform 0.15s;
        }
        .tool-back-btn:active { transform: scale(0.94) translateX(-3px); }

        .tool-view h4 { color: #4caf50; font-size: 1.05rem; letter-spacing: 0.5px; }
        .tool-sub-label { color: #888; font-size: 0.8rem; margin-top: 6px; }

        .tool-field { display: flex; flex-direction: column; gap: 6px; }
        .tool-field label { color: #aaa; font-size: 0.85rem; }
        .tool-field input, .tool-field select {
            background: rgba(255,255,255,0.07); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.14);
            color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 1rem; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .tool-field input:focus, .tool-field select:focus {
            border-color: rgba(76,175,80,0.7);
            box-shadow: 0 0 0 3px rgba(76,175,80,0.15);
        }

        .tool-row { display: flex; gap: 10px; }
        .tool-row .tool-field { flex: 1; }

        .tool-calc-btn {
            background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff; border: none;
            padding: 13px; border-radius: 14px; font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-top: 4px; box-shadow: 0 4px 15px rgba(76,175,80,0.3), inset 0 1px 1px rgba(255,255,255,0.3);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .tool-calc-btn:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(76,175,80,0.5); }

        .tool-result {
            background: rgba(76,175,80,0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(76,175,80,0.3);
            border-radius: 14px; padding: 14px; color: #fff; font-size: 1rem; line-height: 1.6;
            min-height: 20px; white-space: pre-line;
            transition: background 0.2s, border-color 0.2s;
        }
        .tool-result.tr-error { background: rgba(255,87,34,0.1); border-color: rgba(255,87,34,0.35); color: #ff8a65; }
        .tool-result.tr-pop { animation: resultPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes resultPop {
            0% { transform: scale(0.9); opacity: 0.3; filter: blur(3px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0); }
        }

    </style>
</head>
<body>

    <div class="liquid-bg">
        <div class="liquid-blob blob-1"></div>
        <div class="liquid-blob blob-2"></div>
        <div class="liquid-blob blob-3"></div>
        <div class="liquid-blob blob-4"></div>
    </div>

    <div class="calculator">
        <!-- History Overlay & Panel -->
        <div class="history-overlay" id="historyOverlay" onclick="toggleHistory(event)"></div>
        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <h3>History</h3>
                <button class="close-btn" onclick="toggleHistory(event)">✖</button>
            </div>
            <div class="history-list" id="historyList"></div>
            <button class="clear-hist-btn" onclick="clearHistory()">🗑 Clear History</button>
        </div>

        <div class="keypad" id="keypad">
            <!-- Row 1 Sci -->
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('sin('))">sin</button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('cos('))">cos</button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('tan('))">tan</button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('log('))">log</button>

            <!-- Row 2 Sci -->
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('asin('))">sin<span>-1</span></button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('acos('))">cos<span>-1</span></button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('atan('))">tan<span>-1</span></button>

            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('√('))">√</button>

            <button class="btn btn-top" data-key="Escape" onclick="triggerBtn(event, clearAll)">AC</button>
            <button class="btn btn-top" data-key="Backspace" onclick="triggerBtn(event, deleteLast)">DEL</button>
            <button class="btn btn-top" data-key="%" onclick="triggerBtn(event, () => appendOperator('%'))">%</button>
            <button class="btn btn-op" data-key="/" onclick="triggerBtn(event, () => appendOperator('/'))">÷</button>

            <button class="btn" data-key="7" onclick="triggerBtn(event, () => appendNumber('7'))">7</button>
            <button class="btn" data-key="8" onclick="triggerBtn(event, () => appendNumber('8'))">8</button>
            <button class="btn" data-key="9" onclick="triggerBtn(event, () => appendNumber('9'))">9</button>
            <button class="btn btn-op" data-key="*" onclick="triggerBtn(event, () => appendOperator('*'))">×</button>

            <button class="btn" data-key="4" onclick="triggerBtn(event, () => appendNumber('4'))">4</button>
            <button class="btn" data-key="5" onclick="triggerBtn(event, () => appendNumber('5'))">5</button>
            <button class="btn" data-key="6" onclick="triggerBtn(event, () => appendNumber('6'))">6</button>
            <button class="btn btn-op" data-key="-" onclick="triggerBtn(event, () => appendOperator('-'))">−</button>

            <button class="btn" data-key="1" onclick="triggerBtn(event, () => appendNumber('1'))">1</button>
            <button class="btn" data-key="2" onclick="triggerBtn(event, () => appendNumber('2'))">2</button>
            <button class="btn" data-key="3" onclick="triggerBtn(event, () => appendNumber('3'))">3</button>
            <button class="btn btn-op" data-key="+" onclick="triggerBtn(event, () => appendOperator('+'))">+</button>

            <!-- 00 Button added -->
            <button class="btn" onclick="triggerBtn(event, () => appendNumber('00'))">00</button>
            <button class="btn" data-key="0" onclick="triggerBtn(event, () => appendNumber('0'))">0</button>
            <button class="btn" data-key="." onclick="triggerBtn(event, () => appendNumber('.'))">.</button>
            <button class="btn btn-equals" data-key="Enter" onclick="triggerBtn(event, calculate)">=</button>

    <script>
        const currentDisplay = document.getElementById('current');
        const liveResultDisplay = document.getElementById('liveResult');
        const keypad = document.getElementById('keypad');
        const historyPanel = document.getElementById('historyPanel');
        const historyOverlay = document.getElementById('historyOverlay');
        const historyList = document.getElementById('historyList');
        
        let expression = '0'; 
        let isResultDisplayed = false;
        let calcHistory = []; 

        // Custom Math Functions for Degree Mode
        window.sinD = (x) => Math.sin(x * Math.PI / 180);
        window.cosD = (x) => Math.cos(x * Math.PI / 180);
        window.tanD = (x) => Math.tan(x * Math.PI / 180);
        window.asinD = (x) => Math.asin(x) * 180 / Math.PI;
        window.acosD = (x) => Math.acos(x) * 180 / Math.PI;
        window.atanD = (x) => Math.atan(x) * 180 / Math.PI;
        window.log10 = (x) => Math.log10(x);
        window.ln = (x) => Math.log(x);
        window.sqrt = (x) => Math.sqrt(x);

        // Sound Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.05);
        }

        // Ripple Effect
        function createRipple(event, button) {
            const circle = document.createElement('span');
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;

            let clientX, clientY;
            if (event.type.includes('mouse') || event.type.includes('click')) {
                clientX = event.clientX; clientY = event.clientY;
            } else if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX; clientY = event.touches[0].clientY;
            } else {
                const rect = button.getBoundingClientRect();
                clientX = rect.left + radius; clientY = rect.top + radius;
            }

            if (clientX !== undefined && clientY !== undefined) {
                const rect = button.getBoundingClientRect();
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${clientX - rect.left - radius}px`;
                circle.style.top = `${clientY - rect.top - radius}px`;
                circle.classList.add('ripple');

                const existing = button.querySelector('.ripple');
                if (existing) existing.remove();

                button.appendChild(circle);
                setTimeout(() => { circle.remove(); }, 600);
            }
        }

        function triggerBtn(event, action) {
            if (navigator.vibrate) navigator.vibrate(25);
            playClickSound();
            
            const btnElement = event.currentTarget || event.target;
            if(btnElement && btnElement.classList.contains('btn')) {
                createRipple(event, btnElement);
            }
            
            action();
        }

        function toggleSci(event) { 
            if (navigator.vibrate) navigator.vibrate(30);
            keypad.classList.toggle('show-sci'); 
        }

        // Explicitly Toggle History
        function toggleHistory(event) {
            if (navigator.vibrate) navigator.vibrate(20);
            historyPanel.classList.toggle('open');
            historyOverlay.classList.toggle('open');
            if(historyPanel.classList.contains('open')) renderHistory();
        }

        function formatExpression(expr) {
            if(expr === 'Error' || expr === 'NEVER SETTLE') return expr;
            let visual = expr.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
            visual = visual.replace(/\d+(\.\d+)?/g, match => {
                let parts = match.split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                return parts.length > 1 ? parts.join('.') : parts[0];
            });
            return visual;
        }

        
function getLiveResult() {
            let expr = expression.replace(/[+\-*/(]+$/, ''); 
            if(expr === '' || isResultDisplayed) return null;
            
            expr = expr.replace(/asin\(/g, 'asinD(').replace(/acos\(/g, 'acosD(').replace(/atan\(/g, 'atanD(')
                       .replace(/sin\(/g, 'sinD(').replace(/cos\(/g, 'cosD(').replace(/tan\(/g, 'tanD(')
                       .replace(/ln\(/g, 'ln(').replace(/log\(/g, 'log10(').replace(/√\(/g, 'sqrt(')
                       .replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E')
                       .replace(/²/g, '**2').replace(/\^/g, '**');
            try {
                let res = eval(expr);
                if (isNaN(res) || !isFinite(res)) return null;
                return Math.round(res * 100000000) / 100000000;
            } catch(e) {
                return null;
            }
        }

        function animateLiveResult() {
            liveResultDisplay.classList.add('updating');
            setTimeout(() => {
                liveResultDisplay.classList.remove('updating');
            }, 150);
        }

        function updateDisplay() {
            let displayStr = formatExpression(expression);
            
            if (displayStr.length > 18) currentDisplay.style.fontSize = '1.8rem'; 
            else if (displayStr.length > 10) currentDisplay.style.fontSize = '2.5rem';
            else currentDisplay.style.fontSize = '3.8rem';
            
            currentDisplay.innerText = displayStr;

            let live = getLiveResult();
            if (live !== null && live.toString() !== expression) {
                const newLiveText = '= ' + formatExpression(live.toString());
                if (liveResultDisplay.innerText !== newLiveText) {
                    liveResultDisplay.innerText = newLiveText;
                    animateLiveResult();
                }
            } else {
                liveResultDisplay.innerText = '';
            }
        }

        function triggerSlideUp() {
            currentDisplay.classList.remove('slide-up');
            void currentDisplay.offsetWidth; 
            currentDisplay.classList.add('slide-up');
        }

        function checkReset() {
            if (isResultDisplayed || expression === 'Error' || currentDisplay.classList.contains('never-settle')) {
                expression = '';
                isResultDisplayed = false;
                currentDisplay.classList.remove('never-settle');
            }
        }

        function appendNumber(num) {
            checkReset();
            let lastToken = expression.split(/[^0-9.]/).pop();
            if (num === '.' && lastToken.includes('.')) return;
            
            if (expression === '0') {
                if (num === '.') expression = '0.';
                else if (num === '00') expression = '0';
                else expression = num;
            } else {
                expression += num;
            }
            updateDisplay(); triggerSlideUp();
        }

        function appendSci(func) {
            checkReset();
            if (expression === '0') expression = func;
            else expression += func;
            updateDisplay(); triggerSlideUp();
        }

        function appendOperator(op) {
            if (expression === 'Error') return;
            if (isResultDisplayed) isResultDisplayed = false; 

            if (op === '²') {
                expression += '²';
            } else {
                let lastChar = expression.slice(-1);
                if (['+', '-', '*', '/'].includes(lastChar)) {
                    expression = expression.slice(0, -1) + op;
                } else {
                    expression += op;
                }
            }
            updateDisplay(); triggerSlideUp();
        }

        function clearAll() {
            expression = '0'; isResultDisplayed = false;
            currentDisplay.classList.remove('never-settle');
            updateDisplay(); triggerSlideUp();
        }

        function deleteLast() {
            if (isResultDisplayed || currentDisplay.classList.contains('never-settle')) { clearAll(); return; }
            if (expression.length > 1) expression = expression.slice(0, -1);
            else expression = '0';
            updateDisplay();
        }

        function calculate() {
            if (expression === '1+') { triggerEasterEgg(); return; }
            let res = getLiveResult();
            if (res !== null) {
                saveToHistory(formatExpression(expression), res);
                expression = res.toString();
                isResultDisplayed = true;
                updateDisplay(); triggerSlideUp();
            }
        }

        function triggerEasterEgg() {
            expression = 'NEVER SETTLE'; isResultDisplayed = true;
            currentDisplay.classList.add('never-settle');
            updateDisplay(); triggerSlideUp();
        }

        // --- History Logic ---
        function saveToHistory(expr, res) {
            calcHistory.unshift({ expression: expr, result: formatExpression(res.toString()) });
            if(calcHistory.length > 25) calcHistory.pop(); 
        }

        function renderHistory() {
            historyList.innerHTML = '';
            if(calcHistory.length === 0) {
                historyList.innerHTML = '<p style="color:#666; text-align:center; margin-top:20px; font-size:1.1rem;">No history yet</p>';
                return;
            }
            calcHistory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.style.animationDelay = `${index * 0.05}s`;
                div.innerHTML = `<div class="hist-expr">${item.expression} =</div><div class="hist-res">${item.result}</div>`;
                div.onclick = () => {
                    expression = item.result.replace(/,/g, '');
                    isResultDisplayed = true;
                    toggleHistory(); 
                    updateDisplay();
                };
                historyList.appendChild(div);
            });
        }

        function clearHistory() { 
            calcHistory = []; 
            renderHistory(); 
        }

        /* ============================================================= */
        /* --- EXTRA TOOLS LOGIC (added; does not touch calculator code) --- */
        /* ============================================================= */
        const dotMenu = document.getElementById('dotMenu');

        function toggleDotMenu(event) {
            event.stopPropagation();
            if (navigator.vibrate) navigator.vibrate(15);
            dotMenu.classList.toggle('open');
        }
        function closeDotMenu() { dotMenu.classList.remove('open'); }
        document.addEventListener('click', (e) => {
            if (dotMenu.classList.contains('open') && !e.target.closest('.dot-menu-wrap')) {
                closeDotMenu();
            }
        });

        const toolsPanel = document.getElementById('toolsPanel');
        const toolsOverlay = document.getElementById('toolsOverlay');
        const toolGrid = document.getElementById('toolGrid');

        function toggleTools(event) {
            if (navigator.vibrate) navigator.vibrate(20);
            toolsPanel.classList.toggle('open');
            toolsOverlay.classList.toggle('open');
            if (!toolsPanel.classList.contains('open')) closeToolView();
        }

        function openTool(name) {
            toolGrid.style.display = 'none';
            document.querySelectorAll('.tool-view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + name).classList.add('active');
        }

        function closeToolView() {
            toolGrid.style.display = 'grid';
            document.querySelectorAll('.tool-view').forEach(v => v.classList.remove('active'));
        }

        function showToolResult(elId, text, isError) {
            const el = document.getElementById(elId);
            el.innerText = text;
            el.classList.toggle('tr-error', !!isError);
            el.classList.remove('tr-pop');
            void el.offsetWidth; // restart animation
            el.classList.add('tr-pop');
        }

        function fmtNum(n, decimals = 2) {
            if (!isFinite(n)) return '—';
            return n.toLocaleString('en-IN', { maximumFractionDigits: decimals, minimumFractionDigits: 0 });
        }

        // --- BMI ---
        function calcBMI() {
            const h = parseFloat(document.getElementById('bmiHeight').value);
            const w = parseFloat(document.getElementById('bmiWeight').value);
            if (!h || !w || h <= 0 || w <= 0) {
                showToolResult('bmiResult', 'Please enter valid height and weight.', true); return;
            }
            const meters = h / 100;
            const bmi = w / (meters * meters);
            let category = 'Normal';
            if (bmi < 18.5) category = 'Underweight';
            else if (bmi < 25) category = 'Normal';
            else if (bmi < 30) category = 'Overweight';
            else category = 'Obese';
            showToolResult('bmiResult', `Your BMI: ${fmtNum(bmi, 1)}\nCategory: ${category}`);
        }

        // --- Loan / EMI ---
        function calcLoan() {
            const p = parseFloat(document.getElementById('loanPrincipal').value);
            const annualRate = parseFloat(document.getElementById('loanRate').value);
            const n = parseFloat(document.getElementById('loanTenure').value);
            if (!p || p <= 0 || !n || n <= 0 || annualRate < 0 || isNaN(annualRate)) {
                showToolResult('loanResult', 'Please fill all fields correctly.', true); return;
            }
            const r = annualRate / 12 / 100;
            let emi;
            if (r === 0) emi = p / n;
            else emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            const totalPay = emi * n;
            const totalInterest = totalPay - p;
            showToolResult('loanResult',
                `Monthly EMI: ${fmtNum(emi)}\nTotal Payment: ${fmtNum(totalPay)}\nTotal Interest: ${fmtNum(totalInterest)}`);
        }

        // --- Discount ---
        function calcDiscount() {
            const price = parseFloat(document.getElementById('discPrice').value);
            const pct = parseFloat(document.getElementById('discPercent').value);
            if (!price || price <= 0 || isNaN(pct) || pct < 0) {
                showToolResult('discResult', 'Please enter valid price and discount %.', true); return;
            }
            const saved = price * (pct / 100);
            const final = price - saved;
            showToolResult('discResult', `You Save: ${fmtNum(saved)}\nFinal Price: ${fmtNum(final)}`);
        }

        // --- Bill Split / Tips ---
        function calcTip() {
            const bill = parseFloat(document.getElementById('tipBill').value);
            const tipPct = parseFloat(document.getElementById('tipPercent').value) || 0;
            const people = parseFloat(document.getElementById('tipPeople').value) || 1;
            if (!bill || bill <= 0 || people <= 0) {
                showToolResult('tipResult', 'Please enter valid bill and number of people.', true); return;
            }
            const tipAmount = bill * (tipPct / 100);
            const total = bill + tipAmount;
            const perPerson = total / people;
            showToolResult('tipResult',
                `Tip: ${fmtNum(tipAmount)}\nTotal (with tip): ${fmtNum(total)}\nPer Person: ${fmtNum(perPerson)}`);
        }

        // --- Temperature ---
        function calcTemp() {
            const val = parseFloat(document.getElementById('tempValue').value);
            const unit = document.getElementById('tempUnit').value;
            if (isNaN(val)) { showToolResult('tempResult', 'Please enter a value.', true); return; }
            let c;
            if (unit === 'C') c = val;
            else if (unit === 'F') c = (val - 32) * 5 / 9;
            else c = val - 273.15;
            const f = c * 9 / 5 + 32;
            const k = c + 273.15;
            showToolResult('tempResult', `${fmtNum(c, 2)} °C\n${fmtNum(f, 2)} °F\n${fmtNum(k, 2)} K`);
        }

        // --- Currency (live rate via free no-key API) ---
        async function calcCurrency() {
            const amount = parseFloat(document.getElementById('curAmount').value);
            const from = document.getElementById('curFrom').value;
            const to = document.getElementById('curTo').value;
            if (!amount || amount <= 0) {
                showToolResult('curResult', 'Please enter a valid amount.', true); return;
            }
            if (from === to) {
                showToolResult('curResult', `${fmtNum(amount)} ${from} = ${fmtNum(amount)} ${to}`); return;
            }
            showToolResult('curResult', 'Fetching rate...');
            try {
                const res = await fetch(`https://open.er-api.com/v6/latest/${from}`);
                const data = await res.json();
                if (data.result !== 'success' || !data.rates || !data.rates[to]) {
                    throw new Error('rate not found');
                }
                const rate = data.rates[to];
                const converted = amount * rate;
                showToolResult('curResult',
                    `1 ${from} = ${fmtNum(rate, 4)} ${to}\n${fmtNum(amount)} ${from} = ${fmtNum(converted)} ${to}`);
            } catch (e) {
                showToolResult('curResult', 'Could not fetch rate. Check your internet.', true);
            }
        }

        document.addEventListener('keydown', (e) => {
            // If typing inside a Smart Tools field, let the browser handle it normally
            // (don't let the calculator's key-mapping steal the keystroke).
            const active = document.activeElement;
            if (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.tagName === 'TEXTAREA')) {
                return;
            }
            let key = e.key;
            if (key === 'Enter') key = 'Enter'; 
            const btn = document.querySelector(`.btn[data-key="${key}"]`);
            if(btn) {
                e.preventDefault();
                btn.classList.add('keyboard-active');
                
                const rect = btn.getBoundingClientRect();
                const fakeEvent = { 
                    type: 'click', 
                    clientX: rect.left + rect.width/2, 
                    clientY: rect.top + rect.height/2,
                    currentTarget: btn
                };
                btn.onclick(fakeEvent);

                setTimeout(() => btn.classList.remove('keyboard-active'), 150);
            }
        });
    </script>
</body>
</html>
