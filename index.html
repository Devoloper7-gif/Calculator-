<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
    background-color: #000000; color: #ffffff;
    display: flex; justify-content: center; align-items: center;
    height: 100dvh; overflow: hidden; 
    touch-action: none;
}


        .calculator {
    width: 100%; max-width: 400px; height: 100dvh; /* 100vh এর জায়গায় 100dvh */
    display: flex; flex-direction: column; background-color: #00041d;
    position: relative;
}

        /* --- Display Area --- */
        .display-container {
            flex: 1; display: flex; flex-direction: column;
            justify-content: flex-end; align-items: flex-end;
            padding: 30px 20px; position: relative; gap: 5px;
        }

        .top-actions {
            position: absolute; top: 20px; left: 20px;
            z-index: 50;
        }

        .action-btn {
            background: rgba(255,255,255,0.05); color: #00e5ff;
            border: 1px solid rgba(255,255,255,0.1); padding: 8px 18px;
            border-radius: 20px; cursor: pointer; font-weight: bold;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .action-btn:active { transform: scale(0.9); background: rgba(0, 229, 255, 0.2); }

        .current { 
            font-size: 3.8rem; font-weight: 300; color: #ffffff; 
            line-height: 1.2; transition: font-size 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            max-width: 100%; overflow-x: auto; white-space: nowrap;
            text-align: right;
        }
        .current::-webkit-scrollbar { display: none; }
        
        .live-result {
            font-size: 2rem; color: #00e5ff;
            min-height: 40px; font-weight: 500; 
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: right;
            opacity: 0.8;
        }
        .live-result.updating {
            transform: scale(1.05);
            opacity: 1;
        }

        .slide-up { animation: slideUpAnim 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slideUpAnim {
            0% { transform: translateY(15px); opacity: 0; filter: blur(2px); }
            100% { transform: translateY(0); opacity: 1; filter: blur(0); }
        }

        .never-settle {
            font-size: 2.8rem !important; font-weight: bold;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- Keypad Area --- */
        .keypad {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
            padding: 15px 20px 25px 20px; background-color: #000000;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-top-left-radius: 35px; border-top-right-radius: 35px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn {
            position: relative; z-index: 1; overflow: hidden;
            background: rgba(255,255,255,0.05); color: #ffffff;
            border: 1px solid rgba(255,255,255,0.08); border-radius: 50%;
            font-size: 1.8rem; display: flex; justify-content: center; align-items: center;
            cursor: pointer; aspect-ratio: 1 / 1; 
            max-width: 75px; max-height: 75px; margin: auto; width: 100%;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1);
            transition: box-shadow 0.4s ease-in, transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
        }

        .btn:active, .btn.keyboard-active {
            z-index: 10; background: rgba(255,255,255,0.1); transform: scale(0.88);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.1);
        }

        .btn-top, .btn-op { color: #01c1d5; }
        .btn-top:active, .btn-op:active {
            background: rgba(5, 170, 190, 0.2); z-index: 100;
            box-shadow: inset 0 0 1px rgba(0,0,0,0.8), 0 0 40px 15px rgba(12, 187, 217, 0.4);
        }

        .btn-equals {
            background: linear-gradient(135deg, #ff9800, #ff5722); color: #ffffff; border: none;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.4), 0 4px 15px rgba(255,87,34,0.3);
        }
        .btn-equals:active {
            background: linear-gradient(135deg, #e68a00, #e64a19); transform: scale(0.85); z-index: 100;
            box-shadow: inset 0 0 1px rgba(0,0,0,0.8), 0 0 50px 20px rgba(245, 110, 44, 0.6);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: rippleAnim 0.6s linear forwards;
            background: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* --- Scientific Buttons Mod --- */
        .btn-sci { 
            color: #ffcc00; font-size: 1.1rem; font-weight: bold; 
            display: none; opacity: 0; transform: translateY(15px); 
        }
        
        .show-sci { gap: 8px; padding: 15px; }
        .show-sci .btn { font-size: 1.3rem; max-width: 60px; max-height: 60px; }
        .show-sci .btn-sci { display: flex; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .show-sci .btn-sci:nth-child(1) { animation-delay: 0.02s; }
        .show-sci .btn-sci:nth-child(2) { animation-delay: 0.04s; }
        .show-sci .btn-sci:nth-child(3) { animation-delay: 0.06s; }
        .show-sci .btn-sci:nth-child(4) { animation-delay: 0.08s; }
        .show-sci .btn-sci:nth-child(5) { animation-delay: 0.010s; }
        .show-sci .btn-sci:nth-child(6) { animation-delay: 0.12s; }
        .show-sci .btn-sci:nth-child(7) { animation-delay: 0.14s; }
        .show-sci .btn-sci:nth-child(8) { animation-delay: 0.16s; }
        .show-sci .btn-sci:nth-child(9) { animation-delay: 0.18s; }
        .show-sci .btn-sci:nth-child(10) { animation-delay: 0.20s; }
        .show-sci .btn-sci:nth-child(11) { animation-delay: 0.22s; }
        .show-sci .btn-sci:nth-child(12) { animation-delay: 0.24s; }

        .show-sci .btn-equals { font-size: 1.8rem; }
        .show-sci .btn-sci span { font-size: 0.8rem; vertical-align: super; }

        @keyframes popIn { to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="calculator">
        <div class="display-container">
            <div class="top-actions">
                <button class="action-btn" onclick="toggleSci(event)">🪼 Sci Mode</button>
            </div>
            
            <div class="current" id="current">0</div>
            <div class="live-result" id="liveResult"></div>
        </div>

        <div class="keypad" id="keypad">
            <!-- Row 1 Sci -->
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('sin('))">sin</button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('cos('))">cos</button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('tan('))">tan</button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('log('))">log</button>

            <!-- Row 2 Sci -->
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('asin('))">sin<span>-1</span></button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('acos('))">cos<span>-1</span></button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('atan('))">tan<span>-1</span></button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('ln('))">ln</button>

            <!-- Row 3 Sci (Includes Brackets for formulas) -->
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('√('))">√</button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendOperator('²'))">x²</button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci('('))">(</button>
            <button class="btn btn-sci" onclick="triggerBtn(event, () => appendSci(')'))">)</button>

            <!-- Basic Calculator -->
            <button class="btn btn-top" data-key="Escape" onclick="triggerBtn(event, clearAll)">AC</button>
            <button class="btn btn-top" data-key="Backspace" onclick="triggerBtn(event, deleteLast)">DEL</button>
            <button class="btn btn-top" data-key="%" onclick="triggerBtn(event, () => appendOperator('%'))">%</button>
            <button class="btn btn-op" data-key="/" onclick="triggerBtn(event, () => appendOperator('/'))">÷</button>

            <button class="btn" data-key="7" onclick="triggerBtn(event, () => appendNumber('7'))">7</button>
            <button class="btn" data-key="8" onclick="triggerBtn(event, () => appendNumber('8'))">8</button>
            <button class="btn" data-key="9" onclick="triggerBtn(event, () => appendNumber('9'))">9</button>
            <button class="btn btn-op" data-key="*" onclick="triggerBtn(event, () => appendOperator('*'))">×</button>

            <button class="btn" data-key="4" onclick="triggerBtn(event, () => appendNumber('4'))">4</button>
            <button class="btn" data-key="5" onclick="triggerBtn(event, () => appendNumber('5'))">5</button>
            <button class="btn" data-key="6" onclick="triggerBtn(event, () => appendNumber('6'))">6</button>
            <button class="btn btn-op" data-key="-" onclick="triggerBtn(event, () => appendOperator('-'))">−</button>

            <button class="btn" data-key="1" onclick="triggerBtn(event, () => appendNumber('1'))">1</button>
            <button class="btn" data-key="2" onclick="triggerBtn(event, () => appendNumber('2'))">2</button>
            <button class="btn" data-key="3" onclick="triggerBtn(event, () => appendNumber('3'))">3</button>
            <button class="btn btn-op" data-key="+" onclick="triggerBtn(event, () => appendOperator('+'))">+</button>

            <!-- Replaced ( with 00 -->
            <button class="btn" onclick="triggerBtn(event, () => appendNumber('00'))">00</button>
            <button class="btn" data-key="0" onclick="triggerBtn(event, () => appendNumber('0'))">0</button>
            <button class="btn" data-key="." onclick="triggerBtn(event, () => appendNumber('.'))">.</button>
            <button class="btn btn-equals" data-key="Enter" onclick="triggerBtn(event, calculate)">=</button>
        </div>
    </div>

    <script>
        const currentDisplay = document.getElementById('current');
        const liveResultDisplay = document.getElementById('liveResult');
        const keypad = document.getElementById('keypad');
        
        let expression = '0'; 
        let isResultDisplayed = false;

        // Custom Math Functions for Degree Mode
        window.sinD = (x) => Math.sin(x * Math.PI / 180);
        window.cosD = (x) => Math.cos(x * Math.PI / 180);
        window.tanD = (x) => Math.tan(x * Math.PI / 180);
        window.asinD = (x) => Math.asin(x) * 180 / Math.PI;
        window.acosD = (x) => Math.acos(x) * 180 / Math.PI;
        window.atanD = (x) => Math.atan(x) * 180 / Math.PI;
        window.log10 = (x) => Math.log10(x);
        window.ln = (x) => Math.log(x);
        window.sqrt = (x) => Math.sqrt(x);

        // Sound Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.05);
        }

        // Ripple Effect
        function createRipple(event, button) {
            const circle = document.createElement('span');
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;

            let clientX, clientY;
            if (event.type.includes('mouse') || event.type.includes('click')) {
                clientX = event.clientX; clientY = event.clientY;
            } else if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX; clientY = event.touches[0].clientY;
            } else {
                const rect = button.getBoundingClientRect();
                clientX = rect.left + radius; clientY = rect.top + radius;
            }

            if (clientX !== undefined && clientY !== undefined) {
                const rect = button.getBoundingClientRect();
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${clientX - rect.left - radius}px`;
                circle.style.top = `${clientY - rect.top - radius}px`;
                circle.classList.add('ripple');

                const existing = button.querySelector('.ripple');
                if (existing) existing.remove();

                button.appendChild(circle);
                setTimeout(() => { circle.remove(); }, 600);
            }
        }

        function triggerBtn(event, action) {
            if (navigator.vibrate) navigator.vibrate(25);
            playClickSound();
            
            const btnElement = event.currentTarget || event.target;
            if(btnElement && btnElement.classList.contains('btn')) {
                createRipple(event, btnElement);
            }
            
            action();
        }

        function toggleSci(event) { 
            if (navigator.vibrate) navigator.vibrate(30);
            keypad.classList.toggle('show-sci'); 
        }

        function formatExpression(expr) {
            if(expr === 'Error' || expr === 'NEVER SETTLE') return expr;
            let visual = expr.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
            visual = visual.replace(/\d+(\.\d+)?/g, match => {
                let parts = match.split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                return parts.length > 1 ? parts.join('.') : parts[0];
            });
            return visual;
        }

        function getLiveResult() {
            let expr = expression.replace(/[+\-*/(]+$/, ''); 
            if(expr === '' || isResultDisplayed) return null;
            
            expr = expr.replace(/asin\(/g, 'asinD(').replace(/acos\(/g, 'acosD(').replace(/atan\(/g, 'atanD(')
                       .replace(/sin\(/g, 'sinD(').replace(/cos\(/g, 'cosD(').replace(/tan\(/g, 'tanD(')
                       .replace(/ln\(/g, 'ln(').replace(/log\(/g, 'log10(').replace(/√\(/g, 'sqrt(')
                       .replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E')
                       .replace(/²/g, '**2').replace(/\^/g, '**');
            try {
                let res = eval(expr);
                if (isNaN(res) || !isFinite(res)) return null;
                return Math.round(res * 100000000) / 100000000;
            } catch(e) {
                return null;
            }
        }

        function animateLiveResult() {
            liveResultDisplay.classList.add('updating');
            setTimeout(() => {
                liveResultDisplay.classList.remove('updating');
            }, 150);
        }

        function updateDisplay() {
            let displayStr = formatExpression(expression);
            
            if (displayStr.length > 18) currentDisplay.style.fontSize = '1.8rem'; 
            else if (displayStr.length > 10) currentDisplay.style.fontSize = '2.5rem';
            else currentDisplay.style.fontSize = '3.8rem';
            
            currentDisplay.innerText = displayStr;

            let live = getLiveResult();
            if (live !== null && live.toString() !== expression) {
                const newLiveText = '= ' + formatExpression(live.toString());
                if (liveResultDisplay.innerText !== newLiveText) {
                    liveResultDisplay.innerText = newLiveText;
                    animateLiveResult();
                }
            } else {
                liveResultDisplay.innerText = '';
            }
        }

        function triggerSlideUp() {
            currentDisplay.classList.remove('slide-up');
            void currentDisplay.offsetWidth; 
            currentDisplay.classList.add('slide-up');
        }

        function checkReset() {
            if (isResultDisplayed || expression === 'Error' || currentDisplay.classList.contains('never-settle')) {
                expression = '';
                isResultDisplayed = false;
                currentDisplay.classList.remove('never-settle');
            }
        }

        function appendNumber(num) {
            checkReset();
            let lastToken = expression.split(/[^0-9.]/).pop();
            if (num === '.' && lastToken.includes('.')) return;
            
            if (expression === '0') {
                if (num === '.') expression = '0.';
                else if (num === '00') expression = '0';
                else expression = num;
            } else {
                expression += num;
            }
            updateDisplay(); triggerSlideUp();
        }

        function appendSci(func) {
            checkReset();
            if (expression === '0') expression = func;
            else expression += func;
            updateDisplay(); triggerSlideUp();
        }

        function appendOperator(op) {
            if (expression === 'Error') return;
            if (isResultDisplayed) isResultDisplayed = false; 

            if (op === '²') {
                expression += '²';
            } else {
                let lastChar = expression.slice(-1);
                if (['+', '-', '*', '/'].includes(lastChar)) {
                    expression = expression.slice(0, -1) + op;
                } else {
                    expression += op;
                }
            }
            updateDisplay(); triggerSlideUp();
        }

        function clearAll() {
            expression = '0'; isResultDisplayed = false;
            currentDisplay.classList.remove('never-settle');
            updateDisplay(); triggerSlideUp();
        }

        function deleteLast() {
            if (isResultDisplayed || currentDisplay.classList.contains('never-settle')) { clearAll(); return; }
            if (expression.length > 1) expression = expression.slice(0, -1);
            else expression = '0';
            updateDisplay();
        }

        function calculate() {
            if (expression === '1+') { triggerEasterEgg(); return; }
            let res = getLiveResult();
            if (res !== null) {
                expression = res.toString();
                isResultDisplayed = true;
                updateDisplay(); triggerSlideUp();
            }
        }

        function triggerEasterEgg() {
            expression = 'NEVER SETTLE'; isResultDisplayed = true;
            currentDisplay.classList.add('never-settle');
            updateDisplay(); triggerSlideUp();
        }

        document.addEventListener('keydown', (e) => {
            let key = e.key;
            if (key === 'Enter') key = 'Enter'; 
            const btn = document.querySelector(`.btn[data-key="${key}"]`);
            if(btn) {
                e.preventDefault();
                btn.classList.add('keyboard-active');
                
                const rect = btn.getBoundingClientRect();
                const fakeEvent = { 
                    type: 'click', 
                    clientX: rect.left + rect.width/2, 
                    clientY: rect.top + rect.height/2,
                    currentTarget: btn
                };
                btn.onclick(fakeEvent);

                setTimeout(() => btn.classList.remove('keyboard-active'), 150);
            }
        });
    </script>
</body>
</html>
